# Function-level reachability rules (stretch goal 1, plan D4-05: "hand-written rules for the demo CVEs").
# package -> rules; a rule names the advisories (GHSA ids, or "*" for every advisory of a package whose public
# API is essentially that one function) and the functions whose call makes the advisory reachable.
# `__call__` means the package's default export itself is called (e.g. `sanitizeHtml(html)`, `jwt(options)`).
# Guardian only ever upgrades "imported" to "called" with a matching call site as evidence; it never claims
# "not called".

npm:
  jsonwebtoken:
    - vuln_ids: [GHSA-c7hr-j4mj-j2w6, GHSA-8cf7-32gw-wr33, GHSA-qwph-4952-7xr6, GHSA-hjrf-2m68-5959]
      functions: [verify]
      why: token verification flaws (algorithm confusion, key type and default algorithm) are in jwt.verify
  jws:
    - vuln_ids: [GHSA-gjcw-v447-2w7q]
      functions: [verify]
      why: forgeable public/private tokens are accepted by jws.verify
  express-jwt:
    - vuln_ids: [GHSA-6g6m-m6h5-w9gf]
      functions: [__call__, expressjwt]
      why: the authorization bypass is in the middleware the app creates with expressJwt(options)
  sanitize-html:
    - vuln_ids: ["*"]
      functions: [__call__]
      why: the package is one function, so every advisory is about sanitizeHtml(input)
  notevil:
    - vuln_ids: ["*"]
      functions: [__call__, eval]
      why: the sandbox escape is in evaluating code with notevil's eval
  lodash:
    - vuln_ids: [GHSA-35jh-r3h4-6jhm]
      functions: [template]
      why: command injection via _.template
    - vuln_ids: [GHSA-jf85-cpcp-j695]
      functions: [defaultsDeep]
      why: prototype pollution via _.defaultsDeep
    - vuln_ids: [GHSA-p6mc-m468-83gw]
      functions: [zipObjectDeep]
      why: prototype pollution via _.zipObjectDeep
    - vuln_ids: [GHSA-4xc9-xhrj-v574]
      functions: [merge, mergeWith, defaultsDeep]
      why: prototype pollution via _.merge, _.mergeWith and _.defaultsDeep
