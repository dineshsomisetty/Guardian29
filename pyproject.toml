[project]
name = "guardian"
version = "0.1.0"
description = "Guardian - agentic software supply chain guardian"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "langgraph>=0.2",
    "anthropic>=0.40",
    "httpx>=0.27",
    "networkx>=3.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "langgraph-checkpoint-sqlite>=2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardian"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP042"]  # UP042: keep `str, Enum` exactly as in the §5.1 contract

[tool.pytest.ini_options]
testpaths = ["tests"]
